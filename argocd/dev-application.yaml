
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodejs-api-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Narek97/gitops-infrastructure.git
    targetRevision: main
    path: apps/nodejs-api/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: nodejs-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
